name: urlises

services:
  postgres:
    image: postgres:16-alpine
    container_name: urlises-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - urlises-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - urlises

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: urlises-backend:prod
    container_name: urlises-api
    env_file:
      - .env
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://admin.urlises.lab.dtfuria.xyz}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://admin.urlises.lab.dtfuria.xyz}
    ports:
      - "${BIND_ADDR:-10.77.0.2}:${API_PORT:-8080}:8080"
    extra_hosts:
      # Route MAIL_SMTP_HOST over the WireGuard mesh instead of its public IP.
      # The TLS certificate is issued for the hostname, so the hostname must
      # stay as-is (SNI/cert validation would fail against a bare IP) — only
      # override what address it resolves to inside this container. Set both
      # MAIL_SMTP_HOST_IP and MAIL_SMTP_HOST to match your mail server's real
      # WireGuard peer if it isn't publicly reachable on MAIL_SMTP_PORT.
      - "${MAIL_SMTP_HOST:-mail.urlises.lab.dtfuria.xyz}:${MAIL_SMTP_HOST_IP:-10.77.0.3}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - urlises

  admin-web:
    build:
      context: ./admin-web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.urlises.lab.dtfuria.xyz}
    image: urlises-admin-web:prod
    container_name: urlises-admin
    ports:
      - "${BIND_ADDR:-10.77.0.2}:${ADMIN_PORT:-8082}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - urlises

volumes:
  urlises-postgres-data:

networks:
  urlises:
    driver: bridge
