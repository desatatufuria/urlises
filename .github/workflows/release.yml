name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  backend-image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: registry.desatatufuria.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Compute image tags
        id: image_tags
        run: |
          TAGS="registry.desatatufuria.com/dtf-bookmarks-sync-backend:${{ github.ref_name }}"
          # A tag with a hyphen after the version (v1.0.0-rc.1, v1.0.0-beta.2)
          # is a pre-release: it must never become :latest.
          if [[ "${{ github.ref_name }}" != *-* ]]; then
            TAGS="${TAGS}"$'\n'"registry.desatatufuria.com/dtf-bookmarks-sync-backend:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}

  admin-web-image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: registry.desatatufuria.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Compute image tags
        id: image_tags
        run: |
          TAGS="registry.desatatufuria.com/dtf-bookmarks-sync-admin-web:${{ github.ref_name }}"
          # A tag with a hyphen after the version (v1.0.0-rc.1, v1.0.0-beta.2)
          # is a pre-release: it must never become :latest.
          if [[ "${{ github.ref_name }}" != *-* ]]; then
            TAGS="${TAGS}"$'\n'"registry.desatatufuria.com/dtf-bookmarks-sync-admin-web:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./admin-web
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}

  extension-artifact:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - working-directory: extension
        run: npm ci
      - working-directory: extension
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: extension/release/*.zip

  deploy-dev:
    needs: [backend-image, admin-web-image]
    # Only real tag pushes trigger a deploy -- a workflow_dispatch off a
    # branch (used for testing the pipeline itself) must never be mistaken
    # for a release tag by the hyphen check below.
    if: github.ref_type == 'tag' && contains(github.ref_name, '-')
    environment: development
    runs-on: self-hosted
    steps:
      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: registry.desatatufuria.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Deploy
        working-directory: ${{ vars.DEPLOY_PATH }}
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          docker compose -f docker-compose.registry.yml pull
          docker compose -f docker-compose.registry.yml up -d

  deploy-prod:
    needs: [backend-image, admin-web-image]
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-')
    environment: production
    # No runner carries the "prod" label yet -- this job parks in the
    # required-reviewer approval state (no runner search happens until
    # approved) rather than failing or deploying to the wrong machine.
    runs-on: [self-hosted, prod]
    steps:
      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: registry.desatatufuria.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Deploy
        working-directory: ${{ vars.DEPLOY_PATH }}
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          docker compose -f docker-compose.registry.yml pull
          docker compose -f docker-compose.registry.yml up -d

  github-release:
    needs: [backend-image, admin-web-image, extension-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: extension-zip
          path: dist/extension
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/extension/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
