<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shared Bookmark Sync Settings</title>
    <link rel="stylesheet" href="../shared/ui/theme.css" />
  </head>
  <body class="ui-shell">
    <section class="ui-hero">
      <div class="ui-eyebrow">Workspace sync</div>
      <h1 class="ui-title">Workspace Projection</h1>
      <p class="ui-subtitle">Select workspaces, read sync health clearly, and recover degraded state when needed.</p>
    </section>

    <div class="ui-grid">
      <section class="ui-surface ui-panel ui-grid">
        <div class="ui-grid ui-grid--compact">
          <h2 class="ui-section-title">Overview</h2>
          <p id="summary" class="ui-card-copy"></p>
        </div>
        <div id="overview-metrics" class="ui-kpi-grid"></div>
      </section>

      <section id="live-sync-status" class="ui-surface ui-panel ui-banner--attention" hidden>
        <div class="ui-grid ui-grid--compact">
          <h2 class="ui-card-title">Sync needs attention</h2>
          <p id="live-sync-status-text" class="ui-card-copy"></p>
        </div>
      </section>

      <section class="ui-surface ui-panel ui-grid">
        <div class="ui-grid ui-grid--compact">
          <h2 class="ui-card-title">Workspace selection</h2>
          <p class="ui-card-copy">Each card keeps health, activity, and recovery actions in view.</p>
        </div>
        <div id="workspace-groups" class="ui-grid"></div>
        <div class="ui-actions">
          <button id="save-selection" class="ui-button-primary" type="button">Save workspace selection</button>
          <button id="resync-all" class="ui-button-secondary" type="button">Resync all selected workspaces</button>
        </div>
      </section>

      <section class="ui-surface ui-panel ui-grid">
        <div class="ui-grid ui-grid--compact">
          <h2 class="ui-card-title">Log</h2>
          <p class="ui-card-copy">Recent events stay readable and explicit.</p>
        </div>
        <div id="diagnostics" class="ui-log" role="log" aria-live="polite"></div>
      </section>
    </div>

    <script type="module" src="../../dist/options/options.js"></script>
  </body>
</html>
