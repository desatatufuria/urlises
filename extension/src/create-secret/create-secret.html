<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Create a secret · SecretHide</title>
    <link rel="stylesheet" href="../shared/ui/theme.css" />
  </head>
  <body class="ui-shell ui-shell--compact-window">
    <section class="ui-hero ui-hero--compact">
      <div class="ui-eyebrow">SecretHide</div>
      <h1 class="ui-title">Create a secret</h1>
      <p class="ui-subtitle">Encrypted in this browser. Opens once, then it's gone.</p>
    </section>

    <section id="signed-out-notice" class="ui-surface ui-panel ui-panel--compact ui-grid hidden">
      <p class="ui-card-copy">Sign in from the URLises popup first, then reopen this window.</p>
    </section>

    <section id="create-form-section" class="ui-surface ui-panel ui-panel--compact ui-grid ui-grid--compact">
      <form id="create-secret-form" class="ui-form">
        <label class="ui-field-label">
          Content
          <textarea id="secret-content" rows="4" placeholder="Paste the secret to share" required></textarea>
        </label>
        <p id="content-limit-hint" class="ui-muted"></p>

        <div class="ui-form-row">
          <label class="ui-field-label">
            Passphrase (optional)
            <input id="secret-passphrase" type="password" placeholder="Optional" />
          </label>
          <label class="ui-field-label">
            Expires after
            <select id="secret-ttl">
              <option value="3600">1 hour</option>
              <option value="86400" selected>1 day</option>
              <option value="259200">3 days</option>
              <option value="604800">7 days</option>
            </select>
          </label>
        </div>
        <p class="ui-advanced-hint">Adds a second factor only the recipient knows.</p>

        <div class="ui-actions">
          <button id="create-secret-submit" class="ui-button-secondary" type="submit">Create link</button>
        </div>
      </form>
      <p id="secret-create-error" class="ui-error" role="alert"></p>
    </section>

    <section id="secret-link-result" class="ui-surface ui-panel ui-panel--compact ui-grid ui-grid--compact hidden">
      <label class="ui-field-label">
        Share link — opens once
        <div class="ui-actions">
          <input id="secret-link-output" class="ui-copy" type="text" readonly />
          <button id="copy-secret-link" class="ui-button-secondary" type="button">Copy</button>
        </div>
      </label>

      <hr class="ui-divider" />

      <form id="send-email-form" class="ui-form">
        <label class="ui-field-label">
          Or send by email — content stays encrypted
          <div class="ui-actions">
            <input id="recipient-email" type="email" placeholder="them@example.com" required />
            <button id="send-email-submit" class="ui-button-secondary" type="submit">Send</button>
          </div>
        </label>
      </form>
      <p id="send-email-feedback" class="ui-card-copy"></p>
      <p id="send-email-error" class="ui-error" role="alert"></p>

      <button id="create-another-secret" class="ui-button-ghost" type="button">Create another</button>
    </section>

    <script type="module" src="../../dist/create-secret/create-secret.js"></script>
  </body>
</html>
