name: shared-bookmark-sync

services:
  postgres:
    image: postgres:16-alpine
    container_name: shared-bookmark-sync-postgres
    environment:
      POSTGRES_DB: shared_bookmark_sync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - shared-bookmark-sync-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shared_bookmark_sync"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - dtf-netwok

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: shared-bookmark-sync-backend:local
    container_name: shared-bookmark-sync-backend
    environment:
      APP_ROOT: /app
      SERVER_ADDR: :8080
      AUTH_JWT_SECRET: change-me-for-local-dev
      AUTH_CLIENT_ID_HEADER: X-Client-Id
      AUTH_TOKEN_TTL: 24h
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/shared_bookmark_sync?sslmode=disable
      DATABASE_AUTO_MIGRATE: "true"
      DATABASE_MIGRATIONS_DIR: migrations
      DATABASE_MAX_CONNS: "10"
      DATABASE_MIN_CONNS: "1"
      PUBLIC_BASE_URL: http://localhost:5173
      # Instance-wide self-registration lock. Default true preserves today's
      # open POST /auth/register dev workflow. Set to "false" to require a
      # valid, pending invitation token (or first-owner bootstrap) to
      # register.
      OPEN_REGISTRATION_ENABLED: "true"
      MAIL_ENABLED: "true"
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: "1025"
      MAIL_TLS_MODE: none
      MAIL_AUTH_MODE: none
      MAIL_FROM_ADDRESS: mailer@local.test
      MAIL_FROM_DISPLAY_NAME: URLises
      MAIL_REPLY_TO: support@local.test
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default
      - dtf-netwok

  admin-web:
    build:
      context: ./admin-web
      args:
        VITE_API_BASE_URL: /api
    image: shared-bookmark-sync-admin-web:local
    container_name: shared-bookmark-sync-admin-web
    ports:
      - "127.0.0.1:${ADMIN_WEB_HOST_PORT:-0}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - dtf-netwok

  mailpit:
    image: axllent/mailpit:latest
    container_name: shared-bookmark-sync-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-11025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-18025}:8025"
    networks:
      - default
      - dtf-netwok

volumes:
  shared-bookmark-sync-postgres-data:

networks:
  dtf-netwok:
    external: true
    name: dtf-netwok
